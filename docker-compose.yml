version: '3.8'

services:
  zookeeper:
    image: zookeeper:3.8
    container_name: solr-zookeeper
    environment:
      ZOO_MY_ID: 1
      ZOO_SERVERS: server.1=0.0.0.0:2888:3888;2181
    ports:
      - "2181:2181"
    volumes:
      - zookeeper_data:/data
      - zookeeper_logs:/datalog
    networks:
      - solr-network

  solr1:
    image: solr:9.9
    container_name: solr-node1
    ports:
      - "8983:8983"
    environment:
      - ZK_HOST=zookeeper:2181
      - SOLR_HOST=solr1
    depends_on:
      - zookeeper
    volumes:
      - solr1_data:/var/solr
    networks:
      - solr-network
    command: solr-foreground

  solr2:
    image: solr:9.9
    container_name: solr-node2
    ports:
      - "8984:8983"
    environment:
      - ZK_HOST=zookeeper:2181
      - SOLR_HOST=solr2
    depends_on:
      - zookeeper
      - solr1
    volumes:
      - solr2_data:/var/solr
    networks:
      - solr-network
    command: solr-foreground

  solr3:
    image: solr:9.9
    container_name: solr-node3
    ports:
      - "8985:8983"
    environment:
      - ZK_HOST=zookeeper:2181
      - SOLR_HOST=solr3
    depends_on:
      - zookeeper
      - solr1
    volumes:
      - solr3_data:/var/solr
    networks:
      - solr-network
    command: solr-foreground

  collection-creator:
    image: solr:9.9
    container_name: solr-collection-creator
    depends_on:
      - solr1
      - solr2
      - solr3
    networks:
      - solr-network
    command: >
      bash -c "
        echo 'Waiting for Solr nodes to be ready...' &&
        sleep 15 &&
        echo 'Creating books collection...' &&
        solr create -c books -shards 2 -replicationFactor 2 -p 8983 -z zookeeper:2181 &&
        echo 'Collection created successfully'
      "

  solr-client:
    build:
      context: ./java-solr-client
      dockerfile: Dockerfile
    container_name: solr-spring-client
    depends_on:
      - collection-creator
    environment:
      - SOLR_URL=http://solr1:8983/solr
    networks:
      - solr-network
    command: >
      bash -c "
        echo 'Waiting for collection to be ready...' &&
        sleep 10 &&
        java -jar solr-client-1.0-SNAPSHOT.jar
      "

volumes:
  zookeeper_data:
  zookeeper_logs:
  solr1_data:
  solr2_data:
  solr3_data:

networks:
  solr-network:
    driver: bridge
